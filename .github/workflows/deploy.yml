# Baut das Container-Image und legt es in der GHCR ab. Es DEPLOYT NICHT.
#
# Der Prod-Deploy laeuft bewusst von Hand: `scripts/deploy-vps.sh <commit>`
# ueber SSH gegen /docker/thearchitect (docker-compose.prod.yml). Ein zweiter,
# automatischer Weg zur Produktion existierte hier bis 2026-08-10 als `deploy`-Job
# (Hostinger-Compose-API, Stand Maerz 2026) — er hat nie funktioniert und haette
# im Erfolgsfall die laufende Prod-Compose ueberschrieben. Entfernt.
#
# Ob es je ein Auto-Deploy auf master geben soll, entscheidet THE-479
# (image-basiertes Deploy). Das Image hier ist die Vorleistung dafuer.

name: Build & Push

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Set lowercase image name
        id: lower
        run: echo "image=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.lower.outputs.image }}:latest
            ${{ env.REGISTRY }}/${{ steps.lower.outputs.image }}:${{ github.sha }}
