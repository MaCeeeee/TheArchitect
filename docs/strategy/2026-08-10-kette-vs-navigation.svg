<text x="60" y="70" font-size="30" fill="#1e1e1e" text-anchor="start">Was ist „die Kette" — und warum ist sie nicht das Menü?</text>
<text x="60" y="103" font-size="15" fill="#868e96" text-anchor="start">Stand 2026-08-10 · Die Kette ist ein DATENFLUSS über sieben Stationen. Das Menü sortiert WERKZEUGE nach drei Toren. Beide Achsen kreuzen sich — sie decken sich nicht.</text>
<text x="60" y="155" font-size="15" fill="#868e96" text-anchor="start">WAS DAS DATENMODELL TRÄGT</text>
<text x="560" y="155" font-size="15" fill="#1971c2" text-anchor="start">DIE KETTE — sieben Stationen</text>
<text x="1250" y="155" font-size="15" fill="#868e96" text-anchor="start">WO IM PRODUKT (Fläche · Menüpunkt)</text>
