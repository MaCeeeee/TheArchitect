<text x="1250" y="975" font-size="13" fill="#e03131" text-anchor="start">▲ ab hier verlässt die Kette die Conformance-Fläche</text>
<rect x="60" y="1360" width="1890" height="340" rx="10" fill="#f8f9fa" stroke="#1971c2" stroke-width="2" stroke-dasharray="10 6"/>
<text x="84" y="1399" font-size="19" fill="#1971c2" text-anchor="start">Das Menü im Screenshot — eine ANDERE Achse</text>
<text x="84" y="1425" font-size="13" fill="#868e96" text-anchor="start">Es sortiert nach den drei Konformitäts-Toren, nicht nach Stationen. Die Verben stehen als Badge; die Namen sprechen (ComplianceSidebar.tsx:13).</text>
<rect x="84" y="1452" width="600" height="220" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="100" y="1481.5" font-size="13.5" fill="#1e1e1e" text-anchor="start">Subjekt: YOUR MODEL   ·   Cover</text>
<text x="100" y="1514" font-size="12" fill="#868e96" text-anchor="start">Pipeline · Portfolio · Standards · Matrix · Remediate · Gen. Policies · Roadmap ·</text>
<text x="100" y="1529" font-size="12" fill="#868e96" text-anchor="start">Elements · Progress · Gap Analysis · Audit</text>
<text x="100" y="1608.5" font-size="12.5" fill="#868e96" text-anchor="start">Bedient Station 1, 3 und 4.</text>
<rect x="714" y="1452" width="480" height="220" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="730" y="1481.5" font-size="13.5" fill="#1e1e1e" text-anchor="start">Subjekt: YOUR MODEL   ·   Enforce</text>
<text x="730" y="1514" font-size="12" fill="#868e96" text-anchor="start">Dashboard · Approvals · Policy Manager · Audit Trail</text>
<text x="730" y="1608.5" font-size="12.5" fill="#868e96" text-anchor="start">Policies gegen das Modell — keine Station der Kette.</text>
<rect x="1224" y="1452" width="725" height="220" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="1240" y="1481.5" font-size="13.5" fill="#1e1e1e" text-anchor="start">Subjekt: IMPORTED WORKFLOWS   ·   Attest</text>
<text x="1240" y="1514" font-size="12" fill="#868e96" text-anchor="start">Assess Workflow · Certify</text>
<text x="1240" y="1608.5" font-size="12.5" fill="#e03131" text-anchor="start">ANDERES SUBJEKT. Attestiert Workflows, nicht die Anforderungen deines Modells — das Attest aus</text>
<text x="1240" y="1624.125" font-size="12.5" fill="#e03131" text-anchor="start">Station 7 sitzt woanders.</text>
<rect x="60" y="1740" width="1890" height="230" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/>
<text x="84" y="1780" font-size="18" fill="#1e1e1e" text-anchor="start">Die Antwort auf die Frage</text>
<text x="84" y="1812.5" font-size="14.5" fill="#1e1e1e" text-anchor="start">Nein — die Kette ist nicht das Menü. Sie ist der Weg, den EINE PFLICHT durch das System nimmt: vom Gesetzestext bis zu dem Satz „dafür stehe ich gerade".</text>
<text x="84" y="1830.625" font-size="14.5" fill="#1e1e1e" text-anchor="start">Das Menü ist ein Werkzeugkasten, sortiert nach Toren. Beide sind für sich richtig; sie sind nur nicht dieselbe Sache — und an drei Stellen fällt das auf:</text>
<text x="84" y="1848.75" font-size="14.5" fill="#1e1e1e" text-anchor="start"></text>
<text x="84" y="1866.875" font-size="14.5" fill="#1e1e1e" text-anchor="start">   ·  Station 2 (Anforderungen erzeugen) sitzt in der PROJEKT-Werkzeugleiste, nicht in der Conformance-Navigation — dort, wo die Kette lebt.</text>
<text x="84" y="1885" font-size="14.5" fill="#1e1e1e" text-anchor="start">   ·  Station 5 (Deckung) hat gar keinen Menüpunkt. Sie entsteht als Nebenwirkung des Apply — sichtbar erst, wenn man weiß, wo man hinsieht.</text>
<text x="84" y="1903.125" font-size="14.5" fill="#1e1e1e" text-anchor="start">   ·  Station 6 und 7 liegen in der ARCHITEKTUR-Ansicht am Element (PropertyPanel), nicht unter „Attestation" — das attestiert importierte Workflows.</text>
</svg>