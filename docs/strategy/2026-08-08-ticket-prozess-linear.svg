<polyline points="723.5999999999999,1230 723.5999999999999,1200 570,1200 570,1230" fill="none" stroke="#e03131" stroke-width="2" stroke-linejoin="round" marker-end="url(#ahe03131)"/>
<text x="606" y="1187" font-size="11" fill="#e03131" text-anchor="start">Blocker gefunden → zurück</text>
<rect x="380" y="1310" width="180" height="44" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="470" y="1336.875" font-size="13" fill="#1e1e1e" text-anchor="middle">Eskalation (Mensch)</text>
<polyline points="570,1282 470,1310" fill="none" stroke="#e03131" stroke-width="2" stroke-linejoin="round" marker-end="url(#ahe03131)"/>
<text x="380" y="1374" font-size="12" fill="#e03131" text-anchor="start">Loop-Budget erschöpft</text>
<rect x="600" y="1310" width="150" height="44" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="675" y="1336.875" font-size="13" fill="#1e1e1e" text-anchor="middle">Canceled</text>
<polyline points="570,1282 675,1310" fill="none" stroke="#e03131" stroke-width="2" stroke-linejoin="round" marker-end="url(#ahe03131)"/>
<text x="600" y="1374" font-size="12" fill="#e03131" text-anchor="start">Kill-Kriterium erfüllt → Re-Trigger notieren</text>
<rect x="180" y="1480" width="780" height="150" rx="10" fill="#ffec99" stroke="#1e1e1e" stroke-width="2"/>
<text x="204" y="1519" font-size="19" fill="#1e1e1e" text-anchor="start">5 · DONE — was ein geschlossenes Ticket tragen muss</text>
<text x="204" y="1546" font-size="14" fill="#1e1e1e" text-anchor="start">REQs gehen einzeln auf Done · der Parent schließt mit Impact (Ist)</text>
<text x="204" y="1563.5" font-size="14" fill="#1e1e1e" text-anchor="start">RVTM: jede Zeile PASS mit konkreter Evidenz — die Matrix ist der Audit-Trail</text>
<text x="204" y="1581" font-size="14" fill="#1e1e1e" text-anchor="start">Autoclose per Branch-Name oder Commit-Titel ⇒ Impact als Kommentar nachtragen</text>
<polyline points="570,260 570,320" fill="none" stroke="#1e1e1e" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah1e1e1e)"/>
<polyline points="570,470 570,530" fill="none" stroke="#1e1e1e" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah1e1e1e)"/>
<text x="592" y="502" font-size="14" fill="#868e96" text-anchor="start">Stufe 6 legt an</text>
<polyline points="570,800 570,860" fill="none" stroke="#1e1e1e" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah1e1e1e)"/>
<text x="592" y="832" font-size="14" fill="#868e96" text-anchor="start">nur das Bau-Ticket läuft weiter</text>
<polyline points="570,1080 570,1140" fill="none" stroke="#1e1e1e" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah1e1e1e)"/>
<text x="592" y="1112" font-size="14" fill="#868e96" text-anchor="start">Status auf In Progress</text>
<polyline points="570,1420 570,1480" fill="none" stroke="#1e1e1e" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah1e1e1e)"/>
<text x="592" y="1452" font-size="14" fill="#868e96" text-anchor="start">Abnahme</text>
<rect x="1250" y="150" width="470" height="1500" rx="10" fill="#f8f9fa" stroke="#c2255c" stroke-width="2" stroke-dasharray="10 6"/>
<text x="1274" y="191" font-size="19" fill="#c2255c" text-anchor="start">REGELN &amp; FALLEN — was den Lauf absichert</text>
<text x="1274" y="219" font-size="13" fill="#868e96" text-anchor="start">Jede Regel hängt an genau dem Schritt,</text>
<text x="1274" y="235.25" font-size="13" fill="#868e96" text-anchor="start">an dem sie zubeißt.</text>
<rect x="1274" y="340" width="422" height="110" rx="10" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<text x="1485" y="383.625" font-size="13" fill="#1e1e1e" text-anchor="middle">Score ist eine Momentaufnahme. Beim Aktivieren eines</text>
<text x="1485" y="399.875" font-size="13" fill="#1e1e1e" text-anchor="middle">Alt-Tickets neu bewerten — gefallene Blocker</text>
<text x="1485" y="416.125" font-size="13" fill="#1e1e1e" text-anchor="middle">verschieben ihn.</text>
<polyline points="1250,395 965,395" fill="none" stroke="#c2255c" stroke-width="3" stroke-linejoin="round" marker-end="url(#ahc2255c)"/>
<rect x="1274" y="610" width="422" height="110" rx="10" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<text x="1485" y="653.625" font-size="13" fill="#1e1e1e" text-anchor="middle">Ein Entscheidungs-Ticket ohne Positiv- UND</text>
<text x="1485" y="669.875" font-size="13" fill="#1e1e1e" text-anchor="middle">Negativ-Kontrolle in der DoD misst nur, was ohnehin</text>
<text x="1485" y="686.125" font-size="13" fill="#1e1e1e" text-anchor="middle">geglaubt wird.</text>
<polyline points="1250,665 965,665" fill="none" stroke="#c2255c" stroke-width="3" stroke-linejoin="round" marker-end="url(#ahc2255c)"/>
<rect x="1274" y="915" width="422" height="110" rx="10" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<text x="1485" y="966.75" font-size="13" fill="#1e1e1e" text-anchor="middle">REQ ist eine prüfbare Bedingung, keine Aufgabe.</text>
<text x="1485" y="983" font-size="13" fill="#1e1e1e" text-anchor="middle">Sonst ist am Ende nicht messbar, ob es fertig ist.</text>
<polyline points="1250,970 965,970" fill="none" stroke="#c2255c" stroke-width="3" stroke-linejoin="round" marker-end="url(#ahc2255c)"/>
<rect x="1274" y="1225" width="422" height="110" rx="10" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<text x="1485" y="1268.625" font-size="13" fill="#1e1e1e" text-anchor="middle">Parallele Sessions teilen den Git-Index — atomar</text>
<text x="1485" y="1284.875" font-size="13" fill="#1e1e1e" text-anchor="middle">committen oder im Worktree arbeiten. Squash-Merge</text>
<text x="1485" y="1301.125" font-size="13" fill="#1e1e1e" text-anchor="middle">schneidet beim damaligen HEAD ab.</text>
<polyline points="1250,1280 965,1280" fill="none" stroke="#c2255c" stroke-width="3" stroke-linejoin="round" marker-end="url(#ahc2255c)"/>
<rect x="1274" y="1500" width="422" height="110" rx="10" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<text x="1485" y="1543.625" font-size="13" fill="#1e1e1e" text-anchor="middle">Branch-Name UND Commit-Titel schließen Tickets</text>
<text x="1485" y="1559.875" font-size="13" fill="#1e1e1e" text-anchor="middle">automatisch. Fehlschließungen auditieren, Impact</text>
<text x="1485" y="1576.125" font-size="13" fill="#1e1e1e" text-anchor="middle">nachtragen.</text>
<polyline points="1250,1555 965,1555" fill="none" stroke="#c2255c" stroke-width="3" stroke-linejoin="round" marker-end="url(#ahc2255c)"/>
<polyline points="204,700 90,700 90,395 175,395" fill="none" stroke="#2f9e44" stroke-width="3" stroke-linejoin="round" marker-end="url(#ah2f9e44)"/>
<text x="108" y="499" font-size="13" fill="#2f9e44" text-anchor="start">Entscheidung geschlossen →</text>
<text x="108" y="515.25" font-size="13" fill="#2f9e44" text-anchor="start">Blocker fällt, Score neu bewerten</text>
<rect x="180" y="1690" width="1540" height="130" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/>
<text x="204" y="1729" font-size="17" fill="#1e1e1e" text-anchor="start">Die Kernaussage</text>
<text x="204" y="1757" font-size="15" fill="#1e1e1e" text-anchor="start">Der Prozess trennt zwei Ticket-Arten: eine Entscheidung schließt mit einem Beleg, ein Bau-Ticket mit Code. Ein Bau-Ticket auf geglaubter Prämisse</text>
<text x="204" y="1775.75" font-size="15" fill="#1e1e1e" text-anchor="start">ist der teuerste Fehler — darum blockiert die Entscheidung, statt dass beide parallel laufen. Und Done heißt Wirkung, nicht Aktivität.</text>
</svg>