<text x="180" y="74" font-size="30" fill="#1e1e1e" text-anchor="start">Der Ticket-Prozess in Linear — von der Idee zum belegten Done</text>
<text x="180" y="105" font-size="15" fill="#868e96" text-anchor="start">Team THE · Stand 2026-08-08 · Status und Labels aus dem Workspace gelesen · Quellen: Pre-Flight-Skill, RVTM-Skill, reale Tickets THE-577 / THE-628</text>
<rect x="180" y="150" width="780" height="110" rx="10" fill="#f1f3f5" stroke="#1e1e1e" stroke-width="2"/>
<text x="204" y="189" font-size="19" fill="#1e1e1e" text-anchor="start">0 · ZULAUF — hier gibt es noch kein Ticket</text>
<text x="204" y="216" font-size="14" fill="#1e1e1e" text-anchor="start">neue Aufgabe · UC-Idee · Bug aus Prod · Kundenfeedback · ein Blocker ist gefallen</text>
<text x="204" y="233.5" font-size="14" fill="#1e1e1e" text-anchor="start">Der Pre-Flight läuft VOR dem Ticket und vor dem Plan — nicht erst vor dem Bau.</text>
<rect x="180" y="320" width="780" height="150" rx="10" fill="#ffd8a8" stroke="#1e1e1e" stroke-width="2"/>
<text x="204" y="359" font-size="19" fill="#1e1e1e" text-anchor="start">1 · PRE-FLIGHT — Pflichtstufen, bevor irgendetwas angelegt wird</text>
<rect x="204" y="382" width="172.5" height="46" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="290.25" y="409.875" font-size="13" fill="#1e1e1e" text-anchor="middle">St. 1–2 · Bestand</text>
<rect x="390.5" y="382" width="172.5" height="46" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="476.75" y="409.875" font-size="13" fill="#1e1e1e" text-anchor="middle">St. 3 · Prämisse</text>
<rect x="577" y="382" width="172.5" height="46" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="663.25" y="409.875" font-size="13" fill="#1e1e1e" text-anchor="middle">St. 4 · WSJF</text>
<rect x="763.5" y="382" width="172.5" height="46" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="849.75" y="409.875" font-size="13" fill="#1e1e1e" text-anchor="middle">St. 5 · Komplexität</text>
<text x="204" y="453" font-size="13" fill="#868e96" text-anchor="start">Erst Stufe 6 legt Tickets an — vorher existiert in Linear nichts.</text>
<rect x="180" y="530" width="780" height="270" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="2"/>
<text x="204" y="569" font-size="19" fill="#1e1e1e" text-anchor="start">2 · DIE GABELUNG — welches Ticket überhaupt entstehen darf</text>
<text x="204" y="601" font-size="15" fill="#868e96" text-anchor="start">Stufe 3 fragt: Ist die tragende Prämisse gemessen oder geglaubt?</text>
<rect x="204" y="620" width="336" height="160" rx="10" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<text x="222" y="651" font-size="13" fill="#1e1e1e" text-anchor="start">geglaubt →  ENTSCHEIDUNGS-TICKET</text>
<text x="222" y="667.25" font-size="13" fill="#1e1e1e" text-anchor="start"></text>
<text x="222" y="683.5" font-size="13" fill="#1e1e1e" text-anchor="start">Titel: „ENTSCHEIDUNG: …"</text>
<text x="222" y="699.75" font-size="13" fill="#1e1e1e" text-anchor="start">Label: Decision</text>
<text x="222" y="716" font-size="13" fill="#1e1e1e" text-anchor="start">schließt mit einer belegten Antwort</text>
<text x="222" y="732.25" font-size="13" fill="#1e1e1e" text-anchor="start">DoD: Positiv- + Negativ-Kontrolle</text>
<rect x="600" y="620" width="336" height="160" rx="10" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="618" y="651" font-size="13" fill="#1e1e1e" text-anchor="start">gemessen →  BAU-TICKET (Parent)</text>
<text x="618" y="667.25" font-size="13" fill="#1e1e1e" text-anchor="start"></text>
<text x="618" y="683.5" font-size="13" fill="#1e1e1e" text-anchor="start">Titel: „UC-XXX-NNN: …"</text>
<text x="618" y="699.75" font-size="13" fill="#1e1e1e" text-anchor="start">Label: Feature | Improvement | Bug</text>
<text x="618" y="716" font-size="13" fill="#1e1e1e" text-anchor="start">schließt mit Code + Impact (Ist)</text>
<text x="618" y="732.25" font-size="13" fill="#1e1e1e" text-anchor="start">darf erst existieren, wenn</text>
<text x="618" y="748.5" font-size="13" fill="#1e1e1e" text-anchor="start">die Entscheidung steht</text>
<polyline points="540,700 600,700" fill="none" stroke="#e03131" stroke-width="3" stroke-linejoin="round" marker-end="url(#ahe03131)"/>
<text x="570" y="686" font-size="12" fill="#e03131" text-anchor="middle">blockiert</text>
<rect x="180" y="860" width="780" height="220" rx="10" fill="#d0ebff" stroke="#1e1e1e" stroke-width="2"/>
<text x="204" y="899" font-size="19" fill="#1e1e1e" text-anchor="start">3 · TICKET-STRUKTUR — Parent und REQ-Kinder</text>
<rect x="204" y="918" width="430" height="46" rx="10" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="419" y="946.25" font-size="14" fill="#1e1e1e" text-anchor="middle">THE-628 · UC-E2E-001 · Label Feature</text>
<rect x="264" y="986" width="420" height="40" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="474" y="1010.875" font-size="13" fill="#1e1e1e" text-anchor="middle">THE-629 · REQ-E2E-001.1 · Label Requirement</text>
<rect x="264" y="1032" width="420" height="40" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="474" y="1056.875" font-size="13" fill="#1e1e1e" text-anchor="middle">THE-630 · REQ-E2E-001.2 · Label Requirement</text>
<polyline points="240,964 240,1006 264,1006" fill="none" stroke="#868e96" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah868e96)"/>
<polyline points="240,964 240,1052 264,1052" fill="none" stroke="#868e96" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah868e96)"/>
<text x="712" y="933" font-size="13" fill="#1e1e1e" text-anchor="start">+ Loop-Kontrakt im Parent:</text>
<text x="712" y="949.25" font-size="13" fill="#1e1e1e" text-anchor="start">Kill · Budget 3 · Impact-Soll</text>
<text x="712" y="1013" font-size="13" fill="#868e96" text-anchor="start">REQs beschreiben Bedingungen,</text>
<text x="712" y="1029.25" font-size="13" fill="#868e96" text-anchor="start">keine Aufgaben.</text>
<rect x="180" y="1140" width="780" height="280" rx="10" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="204" y="1179" font-size="19" fill="#1e1e1e" text-anchor="start">4 · DER LAUF — die Status im Team THE</text>
<rect x="204" y="1230" width="117.6" height="52" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="262.79999999999995" y="1260.875" font-size="13" fill="#1e1e1e" text-anchor="middle">Backlog</text>
<rect x="357.6" y="1230" width="117.6" height="52" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="416.40000000000003" y="1260.875" font-size="13" fill="#1e1e1e" text-anchor="middle">Todo</text>
<rect x="511.2" y="1230" width="117.6" height="52" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="570" y="1260.875" font-size="13" fill="#1e1e1e" text-anchor="middle">In Progress</text>
<rect x="664.8" y="1230" width="117.6" height="52" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
