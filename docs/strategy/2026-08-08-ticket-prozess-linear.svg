<rect x="818.4" y="1230" width="117.6" height="52" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="877.1999999999999" y="1260.875" font-size="13" fill="#1e1e1e" text-anchor="middle">Done</text>
<polyline points="321.6,1256 357.6,1256" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah1e1e1e)"/>
<polyline points="475.20000000000005,1256 511.2,1256" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah1e1e1e)"/>
