<text x="1264" y="1213" font-size="13" fill="#0b7285" text-anchor="start">Subject × Norm — drei Tore:</text>
<text x="1264" y="1229.25" font-size="13" fill="#0b7285" text-anchor="start">COVER · ENFORCE · ATTEST</text>
