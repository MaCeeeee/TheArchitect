<text x="108" y="310" font-size="14" fill="#e03131" text-anchor="start">Rückkopplung 1 — Loop-Kontrakt:</text>
<text x="108" y="327.5" font-size="14" fill="#e03131" text-anchor="start">Impact (Ist) gegen Soll</text>
