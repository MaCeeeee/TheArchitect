<text x="180" y="74" font-size="30" fill="#1e1e1e" text-anchor="start">Von Wert zu Requirement — und was die Ontologie beiträgt</text>
<text x="180" y="105" font-size="15" fill="#868e96" text-anchor="start">Taxonomie der Wertkette · TheArchitect · Stand 2026-08-08 · Quellen: Lean-Canvas/Fermi 2026-08-01, Canon-Architektur 2026-07-05 (ADR-0004-R), Pre-Flight-Skill</text>
