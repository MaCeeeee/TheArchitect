<text x="1300" y="1324" font-size="14" fill="#2f9e44" text-anchor="start">Rückkopplung 2 — Wertsteigerung:</text>
<text x="1300" y="1341.5" font-size="14" fill="#2f9e44" text-anchor="start">jeder Durchlauf reichert den Korpus an</text>
<rect x="180" y="1520" width="1520" height="120" rx="10" fill="#f1f3f5" stroke="#868e96" stroke-width="2"/>
<text x="204" y="1559" font-size="17" fill="#1e1e1e" text-anchor="start">Die Kernaussage</text>
<text x="204" y="1587" font-size="15" fill="#1e1e1e" text-anchor="start">Wert entsteht je Use Case — linear. WERTSTEIGERUNG entsteht in der Ontologie: jeder Durchlauf reichert Korpus und Handlungs-Katalog an, dadurch</text>
<text x="204" y="1605.75" font-size="15" fill="#1e1e1e" text-anchor="start">wird der nächste UC billiger und der Nachweis über mehr Gesetze tragfähig. Die Ontologie ist kein Nebenprodukt der Kette, sondern ihr Zinseszins.</text>
